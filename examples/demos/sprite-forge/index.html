<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Keel · Sprite Forge</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 40%, #150c2b, #06050d 72%);
        color: #fff;
        font-family: ui-monospace, monospace;
      }
      main {
        text-align: center;
        padding: 20px;
      }
      small {
        font-size: 11px;
        letter-spacing: 0.24em;
        color: #7ce7c4;
      }
      h1 {
        font-size: 26px;
        letter-spacing: -0.03em;
        margin: 8px 0 14px;
      }
      #stage {
        display: block;
        margin: 0 auto;
        image-rendering: pixelated;
        border-radius: 14px;
        background: #0a0818;
        width: min(56vw, 280px);
        height: min(56vw, 280px);
        border: 1px solid #ffffff14;
      }
      #controls {
        margin: 14px auto 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        border: 1px solid #ffffff1f;
        color: white;
        background: #ffffff0d;
        border-radius: 999px;
        padding: 7px 12px;
        font: inherit;
        cursor: pointer;
      }
      input[type="range"] { width: 100px; accent-color: #7ce7c4; }
      #frame, #fps-value { color: #9ca3af; font-size: 10px; }
      #status {
        margin-top: 16px;
        font-size: 11px;
        color: #6f6f8c;
        max-width: 460px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <small>WEBGL · MINIMAL ATTRIBUTES</small>
      <h1>Sprite Forge</h1>
      <canvas id="stage"></canvas>
      <div id="controls">
        <button id="previous" type="button">← Frame</button>
        <button id="play" type="button">Pause</button>
        <button id="next" type="button">Frame →</button>
        <span id="frame">frame 1/8</span>
        <input id="fps" type="range" min="1" max="24" value="8" aria-label="Frames per second" />
        <span id="fps-value">8 fps</span>
      </div>
      <div id="status">Loading verified attribute layers…</div>
    </main>
    <script type="module" src="/content/forge.js"></script>
  </body>
</html>
