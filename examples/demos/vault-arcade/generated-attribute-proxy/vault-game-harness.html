<!doctype html>
<html lang="en" data-vault-surface="development-harness">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vault Arcade · Local Generator Harness</title>
    <style>
      :root{color-scheme:dark;font:13px Inter,ui-sans-serif,system-ui,sans-serif;background:#030706;color:#effff9;--mint:#67f6c5;--line:#ffffff1c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;grid-template-rows:auto 1fr;background:#030706}form{display:grid;grid-template-columns:auto minmax(140px,1fr) minmax(140px,1fr) auto;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:#06100e}strong{color:var(--mint);letter-spacing:.08em;text-transform:uppercase}input,button{min-width:0;border:1px solid var(--line);border-radius:9px;background:#0b1714;color:inherit;padding:8px 10px;font:inherit}button{background:var(--mint);color:#03100c;font-weight:900;cursor:pointer}iframe{width:100%;height:100%;border:0;background:#020504}@media(max-width:680px){form{grid-template-columns:1fr 1fr}strong{grid-column:1/-1}}
    </style>
  </head>
  <body>
    <form method="get" action="./vault-game.html" target="vault-preview">
      <strong>Local generator harness</strong>
      <input name="characterSeed" value="orb-character-001" aria-label="Character seed" />
      <input name="mapSeed" value="vault-map-001" aria-label="Map seed" />
      <input type="hidden" name="dev" value="1" /><input type="hidden" name="autostart" value="1" />
      <button type="submit">Render test pairing</button>
    </form>
    <iframe name="vault-preview" title="Vault map viewer development preview" src="./vault-game.html?characterSeed=orb-character-001&amp;mapSeed=vault-map-001&amp;dev=1&amp;autostart=1"></iframe>
  </body>
</html>
