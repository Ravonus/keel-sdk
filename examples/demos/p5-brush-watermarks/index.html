<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Keel · Watermarks</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f4f1e8;
        color: #2b3440;
        font-family: ui-monospace, monospace;
        touch-action: none;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #plate {
        position: absolute;
        left: 24px;
        bottom: 22px;
        z-index: 2;
        pointer-events: none;
      }
      #plate small {
        display: block;
        font-size: 11px;
        letter-spacing: 0.24em;
        color: #62b4c4;
      }
      #plate strong {
        display: block;
        font-size: 22px;
        letter-spacing: -0.02em;
        margin-top: 4px;
        font-weight: 600;
      }
      #plate span {
        display: block;
        font-size: 11px;
        color: #8a8577;
        margin-top: 4px;
      }
      #seedbar {
        position: absolute;
        right: 20px;
        bottom: 20px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #2b3440;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(43, 52, 64, 0.25);
        border-radius: 6px;
        padding: 6px 10px;
        backdrop-filter: blur(2px);
      }
      #seedbar button {
        all: unset;
        cursor: pointer;
        padding: 0 4px;
        color: #2b3440;
      }
      #seedbar button:hover {
        color: #62b4c4;
      }
      #seedlabel {
        min-width: 46px;
        text-align: center;
        letter-spacing: 0.06em;
      }
      @media (max-width: 560px) {
        #plate span {
          display: none;
        }
        #plate strong {
          font-size: 17px;
        }
        #plate {
          left: 14px;
          bottom: 14px;
        }
        #seedbar {
          right: 12px;
          bottom: 12px;
          padding: 5px 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="plate">
      <small>P5.BRUSH · SHARED MODULE</small>
      <strong>Watermarks</strong>
      <span
        >seeded watercolor portraits · hover for the gaze, tap to leave paint,
        swipe for wind</span
      >
    </div>
    <div id="seedbar">
      <button id="seedprev" title="previous seed">◀</button>
      <span id="seedlabel"></span>
      <button id="seednext" title="next seed">▶</button>
      <button id="seedrand" title="random seed">⚄</button>
    </div>
    <script src="/content/p5.min.js"></script>
    <script src="/content/p5.brush.min.js"></script>
    <script type="module" src="/content/portrait.js"></script>
  </body>
</html>
