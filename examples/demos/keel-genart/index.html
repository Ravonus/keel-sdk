<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050401;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #archive-proof {
        position: fixed;
        z-index: 2;
        top: 18px;
        left: 18px;
        max-width: 310px;
        border: 1px solid rgba(255, 207, 90, 0.34);
        border-radius: 12px;
        background: rgba(5, 4, 1, 0.78);
        padding: 10px 12px;
        color: #ffe7a5;
        font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
      }
      #archive-proof strong {
        display: block;
        color: white;
        font-size: 12px;
      }
      #archive-proof[data-state="error"] {
        border-color: #fb7185;
        color: #fecdd3;
      }
      #keel-help {
        position: fixed;
        z-index: 3;
        right: 18px;
        bottom: 18px;
        display: none;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 12px;
        background: rgba(5, 4, 1, 0.88);
        padding: 12px 14px;
        color: #eee;
        font: 11px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #keel-help[data-open="true"] {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="archive-proof" data-state="loading">
      <strong>KEEL · 2023 OBJECT</strong>
      resolving verified historical resources…
    </div>
    <div id="keel-help" data-open="false">
      <strong>VERIFIED VIEWER CONTROLS</strong><br />
      V · toggle verification badge<br />
      H or ? · toggle this help<br />
      G · open the host gallery view
    </div>
    <script src="/content/seedGen.js"></script>
    <script src="/content/start-genart.js"></script>
    <script src="/content/launch.js"></script>
  </body>
</html>
