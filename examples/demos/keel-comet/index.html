<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #comet-proof,
      #comet-help {
        position: fixed;
        z-index: 10;
        border: 1px solid rgba(84, 221, 255, 0.4);
        border-radius: 12px;
        background: rgba(0, 7, 15, 0.82);
        padding: 10px 12px;
        color: #baf4ff;
        font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #comet-proof {
        top: 18px;
        left: 18px;
        max-width: 390px;
        pointer-events: none;
      }
      #comet-proof strong,
      #comet-help strong {
        display: block;
        color: white;
        font-size: 12px;
      }
      #comet-help {
        right: 18px;
        bottom: 18px;
        display: none;
      }
      #comet-help[data-open="true"] {
        display: block;
      }
      #comet-proof[data-state="error"] {
        border-color: #fb7185;
        color: #fecdd3;
      }
    </style>
  </head>
  <body>
    <div id="comet-proof" data-state="loading">
      <strong>KEEL COMET · VERIFYING</strong>
      resolving five contract-indexed objects…
    </div>
    <div id="comet-help" data-open="false">
      <strong>COMET CONTROLS</strong>
      V · toggle proof<br />
      H or ? · toggle help<br />
      G · open gallery<br />
      index · [2,3,4,5,6]
    </div>
    <script src="/content/brotli-compatibility.js"></script>
    <script src="/content/de85.js"></script>
    <script src="/content/seedGen.js"></script>
    <script src="/content/p5-1.7.0.min.js"></script>
    <script src="/content/start-p5.js"></script>
    <script src="/content/launch.js"></script>
  </body>
</html>
