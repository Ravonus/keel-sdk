<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Keel · On-Chain SFX</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 30%, #1a0f33, #06050d 70%);
        color: #fff;
        font-family: ui-monospace, monospace;
      }
      main {
        text-align: center;
        padding: 24px;
        max-width: 560px;
      }
      small {
        font-size: 11px;
        letter-spacing: 0.24em;
        color: #c6a1ff;
      }
      h1 {
        font-size: 30px;
        letter-spacing: -0.03em;
        margin: 10px 0 6px;
      }
      p {
        font-size: 12px;
        line-height: 1.7;
        color: #8b8ba7;
        margin: 0 0 22px;
      }
      #rack {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }
      [hidden] {
        display: none !important;
      }
      button {
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        padding: 11px 22px;
        border-radius: 999px;
        color: #06050d;
        background: var(--accent, #ff8ad4);
        border: 0;
        transition: transform 0.12s ease;
      }
      button:hover {
        transform: translateY(-2px);
      }
      #boot {
        --accent: #59e5ff;
      }
      #status {
        margin-top: 20px;
        font-size: 11px;
        color: #6f6f8c;
        line-height: 1.8;
        min-height: 2em;
      }
    </style>
  </head>
  <body>
    <main>
      <small>SOUNDBOX · PARAMETERS, NOT SAMPLES</small>
      <h1>On-Chain SFX</h1>
      <p>
        Human-editable Sonant JSON compiled to a compact bit codec, then rendered
        to deterministic stereo PCM in your browser. Nothing here is a recording.
      </p>
      <button id="boot" type="button">Start audio</button>
      <div id="rack" hidden></div>
      <div id="status">Audio needs a click before it can start.</div>
    </main>
    <script type="module" src="/content/synth.js"></script>
  </body>
</html>
